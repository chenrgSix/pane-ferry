[package]
license.workspace = true
name = "paneferry-network"
version.workspace = true
edition.workspace = true

[dependencies]
paneferry-platform = { path = "../platform" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
paneferry-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "process", "signal"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
