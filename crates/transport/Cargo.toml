[package]
license.workspace = true
name = "paneferry-transport"
version = "0.1.1"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "time", "rt", "macros", "net"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
base64.workspace = true
