[package]
license = "PolyForm-Noncommercial-1.0.0"
name = "paneferry-launcher"
version = "0.1.2"
edition = "2021"
[workspace]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
sha2 = "0.10"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
paneferry-transport = { path = "../../../crates/transport" }
paneferry-platform = { path = "../../../crates/platform" }
paneferry-protocol = { path = "../../../crates/protocol" }
paneferry-audio = { path = "../../../crates/audio" }
base64 = "0.22"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"

# macOS 27 rejects misaligned dylibs produced by affected Rust strip paths.
# Keep host build tools/proc macros intact; the application remains optimized.
# https://github.com/rust-lang/rust/issues/157750
[profile.release.build-override]
debug = true
strip = "none"
