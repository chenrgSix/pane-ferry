[package]
name = "lan-remoteapp-launcher"
version = "0.1.0"
edition = "2021"
[workspace]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"
sha2 = "0.10"
remoteapp-transport = { path = "../../../crates/transport" }
tokio = { version = "1", features = ["process", "io-util", "time"] }

# macOS 27 rejects misaligned dylibs produced by affected Rust strip paths.
# Keep host build tools/proc macros intact; the application remains optimized.
# https://github.com/rust-lang/rust/issues/157750
[profile.release.build-override]
debug = true
strip = "none"
