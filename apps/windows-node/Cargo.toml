[package]
name = "paneferry-windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
paneferry-backend-windows = { path = "../../crates/backend-windows" }
paneferry-platform = { path = "../../crates/platform" }
paneferry-protocol = { path = "../../crates/protocol" }
paneferry-core = { path = "../../crates/core" }
paneferry-network = { path = "../../crates/network" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
paneferry-transport = { path = "../../crates/transport" }
