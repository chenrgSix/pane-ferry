name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and build Windows installer
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Check launcher and stage installer
        shell: pwsh
        run: |
          cargo test --locked --manifest-path apps/launcher/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Launcher tests failed' }
          $version = (Get-Content apps/launcher/package.json | ConvertFrom-Json).version
          $binary = Get-Item apps/launcher/src-tauri/target/release/paneferry-launcher.exe
          if (-not $binary.VersionInfo.ProductVersion.StartsWith($version)) { throw 'Launcher version mismatch' }
          $installers = @(Get-ChildItem apps/launcher/src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -LiteralPath $installers[0].FullName -Destination "dist/paneferry-v$version-windows-x86_64-setup.exe"
          python scripts/release-manifest.py windows 'dist/*-setup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Manifest failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/*-setup.exe
            dist/BUILD-INFO-windows.json
          if-no-files-found: error
  macos:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test audio and launcher
        run: |
          test "$(uname -m)" = arm64
          cargo test --locked -p paneferry-audio
          (cd apps/launcher && npm ci && npm test && npm run build)
          TAURI_CONFIG='{"bundle":{"resources":[]}}' cargo test --locked --manifest-path apps/launcher/src-tauri/Cargo.toml
      - name: Build and verify Mac archive
        run: |
          bash apps/launcher/scripts/build-macos.sh
          version=$(python3 -c 'import json; print(json.load(open("apps/launcher/package.json"))["version"])')
          bundle='apps/launcher/src-tauri/target/release/bundle/macos/窗渡 PaneFerry.app'
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "dist/paneferry-v$version-macos-arm64.zip"
          verify=$(mktemp -d)
          ditto -x -k "dist/paneferry-v$version-macos-arm64.zip" "$verify"
          app="$verify/窗渡 PaneFerry.app"
          for part in "$app" "$app/Contents/Resources/PaneFerryNode.app" "$app/Contents/Resources/PaneFerryWindowHost.app"; do
            codesign --verify --deep --strict "$part"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$part/Contents/Info.plist")" = "$version"
          done
          lipo -verify_arch arm64 "$app/Contents/MacOS/paneferry-launcher"
          python3 scripts/release-manifest.py macos 'dist/*-macos-arm64.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/*-macos-arm64.zip
            dist/BUILD-INFO-macos.json
          if-no-files-found: error
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake dpkg-dev libx11-dev libxtst-dev libxres-dev libxcomposite-dev libxdamage-dev libxfixes-dev
      - name: Test and build Linux packages
        run: |
          cargo test --locked -p paneferry-audio -p paneferry-platform -p paneferry-network
          python3 tests/e2e/linux_install_safety.py
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          bash scripts/build-linux.sh "dist/paneferry-v$version-linux-x86_64"
          bash scripts/build-deb.sh dist
          test "$(dpkg-deb -f "dist/paneferry_$version-1_amd64.deb" Version)" = "$version-1"
          tar -tzf "dist/paneferry-v$version-linux-x86_64.tar.gz" > dist/linux-package-files.txt
          python3 scripts/release-manifest.py linux 'dist/*.deb' 'dist/*.tar.gz'
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/BUILD-INFO-linux.json
          if-no-files-found: error
