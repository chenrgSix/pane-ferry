name: Windows publisher and controller
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Build and test publisher without controlling the runner desktop
        shell: pwsh
        run: ./scripts/check-windows.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/launcher/package-lock.json
      - name: Build Windows controller and installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipChecks
      - name: Test Windows receiver pipe and lifecycle
        shell: pwsh
        run: cargo test --locked --manifest-path apps/launcher/src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: paneferry-windows-preview
          path: |
            target/release/paneferry-windows.exe
            target/release/paneferry-network.exe
            docs/windows-publishing.md
            docs/windows-receiving.md
            apps/launcher/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
