[workspace]
resolver = "2"
members = ["crates/backend-windows", "crates/platform", "crates/protocol", "crates/transport", "crates/network", "crates/core", "crates/backend-x11", "crates/capture", "apps/linux-agent", "apps/windows-node"]
exclude = ["apps/launcher/src-tauri"]
[workspace.package]
license = "PolyForm-Noncommercial-1.0.0"
version = "0.1.1"
edition = "2021"
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
x11rb = { version = "0.13", features = ["xtest", "composite", "res", "shm", "damage", "render", "dri3", "sync"] }
png = "0.17"
